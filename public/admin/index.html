<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZØR-ATÉ SYSTEM CONTROL</title>
  <meta name="robots" content="noindex, nofollow">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="/css/design-system.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/admin/css/admin.css">

  <!-- SimpleMDE for markdown editing -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/simplemde/latest/simplemde.min.css">
  <script src="https://cdn.jsdelivr.net/simplemde/latest/simplemde.min.js"></script>
</head>
<body class="admin-body">
  
  <!-- Authenticated Layout -->
  <div id="app-layout" class="admin-layout" style="display: none;">
    <aside class="admin-sidebar">
      <div class="sidebar-header">
        <div class="mono-text" style="color: var(--accent); font-weight: bold; letter-spacing: 0.1em;">ZØR-ATÉ CONTROL</div>
      </div>
      <nav class="sidebar-nav">
        <a href="/zorate/dashboard" class="sidebar-link" data-route>Dashboard</a>
        <a href="/zorate/projects" class="sidebar-link" data-route>Systems / Projects</a>
        <a href="/zorate/posts" class="sidebar-link" data-route>The Lab / Posts</a>
        <a href="/zorate/media" class="sidebar-link" data-route>Media Assets</a>
        <div style="flex-grow: 1;"></div>
        <a href="/" class="sidebar-link" target="_blank">View Live Site ↗</a>
        <a href="/zorate/settings" class="sidebar-link" data-route>Settings</a>
        <button id="btn-logout" class="sidebar-link" style="width: 100%; text-align: left; background: none; border: none; cursor: pointer;">Terminate Session</button>
      </nav>
    </aside>
    <main class="admin-main">
      <div id="view-container"></div>
    </main>
  </div>

  <!-- Unauthenticated Layout (Login) -->
  <div id="login-layout" class="login-layout" style="display: none;">
    <div id="login-container"></div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <!-- Media Picker Modal -->
  <div id="media-modal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="mono-text">SELECT MEDIA ASSET</h3>
        <button class="btn btn-close-modal">X</button>
      </div>
      <div class="modal-body">
        <div id="media-modal-grid" class="media-grid"></div>
      </div>
      <div class="modal-footer">
        <div style="font-size: 0.8rem; color: var(--text-tertiary);">Click an asset to select it</div>
      </div>
    </div>
  </div>

  <!-- Core Scripts -->
  <script src="/admin/js/api.js"></script>
  <script src="/admin/js/toast.js"></script>
  <script src="/admin/js/auth.js"></script>
  <script src="/admin/js/router.js"></script>
  <script src="/admin/js/editor.js"></script>
  <script src="/admin/js/media-picker.js"></script>

  <!-- Pages -->
  <script src="/admin/js/pages/login.js"></script>
  <script src="/admin/js/pages/dashboard.js"></script>
  <script src="/admin/js/pages/projects.js"></script>
  <script src="/admin/js/pages/project-editor.js"></script>
  <script src="/admin/js/pages/posts.js"></script>
  <script src="/admin/js/pages/post-editor.js"></script>
  <script src="/admin/js/pages/media.js"></script>
  <script src="/admin/js/pages/settings.js"></script>

  <!-- Init -->
  <script src="/admin/js/app.js"></script>
</body>
</html>
